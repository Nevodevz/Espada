# Override for a shared host behind a Cloudflare Tunnel (OMV server).
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#
# Differences from the base file:
#   - nginx speaks plain HTTP only (TLS is terminated by Cloudflare);
#   - nginx is published on ${HTTP_BIND:-8095} instead of 80/443, which are
#     taken by other projects on the host;
#   - no /etc/letsencrypt or certbot mounts.
# Requires Docker Compose >= 2.24.4 (for !override).

services:
  nginx:
    ports: !override
      - "${HTTP_BIND:-8095}:80"
    volumes: !override
      - ./nginx/nginx.tunnel.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/media:ro
