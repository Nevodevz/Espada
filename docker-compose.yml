services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-espada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-espada}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-espada}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-espada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-espada}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MEDIA_ROOT: /app/media
      # WhatsApp (Evolution API). Empty EVOLUTION_API_KEY/WHATSAPP_WEBHOOK_SECRET
      # keep the integration inert until they are set in .env.
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      WHATSAPP_INSTANCE: ${WHATSAPP_INSTANCE:-espada-sales}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      WHATSAPP_WEBHOOK_BASE: http://backend:8000
      WHATSAPP_MEDIA_ROOT: /app/whatsapp_media
    volumes:
      # Uploaded avatars must survive container rebuilds.
      - media:/app/media
      # Client files from WhatsApp — NOT under media/, which nginx serves publicly.
      - whatsapp_media:/app/whatsapp_media
    expose:
      - "8000"

  # WhatsApp gateway (Baileys). Pinned: 2.4.x requires a licence (all calls → 503).
  # Internal only — no ports; the backend calls it and receives its webhooks.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_URL: http://evolution:8080
      SERVER_DISABLE_MANAGER: "true"
      SERVER_DISABLE_DOCS: "true"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      DATABASE_PROVIDER: postgresql
      # Own schema in the main database: included in pg_dump backups, invisible to Alembic.
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-espada}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-espada}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      LANGUAGE: ru
      CONFIG_SESSION_PHONE_CLIENT: Espada
      QRCODE_LIMIT: "30"
    volumes:
      - evolution_instances:/evolution/instances
    expose:
      - "8080"

  mcp:
    build: ./mcp-server
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000/api
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-espada.anti-flow.com,localhost:9000,127.0.0.1:9000}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-https://espada.anti-flow.com}
    expose:
      - "9000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - mcp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      # Serve uploaded media directly, without going through the app.
      - media:/var/www/media:ro

volumes:
  pgdata:
  media:
  whatsapp_media:
  evolution_instances:
