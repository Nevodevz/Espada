# Espada behind a Cloudflare Tunnel (shared host, e.g. OMV).
# TLS terminates at Cloudflare; cloudflared forwards plain HTTP to this nginx.
# Used by docker-compose.tunnel.yml instead of nginx.conf.
# Upstreams use project-unique aliases: this nginx also sits on the shared
# "edge" network, where other projects have their own "backend"/"frontend".

upstream frontend {
    server espacrm-frontend:3000;
}
upstream backend {
    server espacrm-backend:8000;
}
upstream mcp {
    server espacrm-mcp:9000;
}

# Real client IP comes from Cloudflare; fall back to the TCP peer.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10M;

    # The public side is always HTTPS (Cloudflare edge).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $client_ip;
    proxy_set_header X-Forwarded-For   $client_ip;
    proxy_set_header X-Forwarded-Proto https;

    # Capability tokens are secrets. Keep public share URLs out of access logs.
    location = /api/public/boards/view {
        access_log off;
        proxy_pass http://backend;
    }

    location /api/ {
        proxy_pass http://backend;
    }

    # Uploaded media (avatars) — served straight from the shared volume.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # MCP (Model Context Protocol) — Streamable HTTP for Claude
    location /mcp {
        proxy_pass http://mcp;
        proxy_http_version 1.1;
        # Any proxy_set_header here disables inheritance from the server
        # block, so repeat them all (MCP validates Host → 421 otherwise).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /share/ {
        access_log off;
        proxy_pass http://frontend;
    }

    location / {
        proxy_pass http://frontend;
    }
}
